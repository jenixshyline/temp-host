<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NolenixSync CRM | Enterprise concept</title>
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#19364b;background:#f5f8fa;font-size:12px;--ink:#19364b;--muted:#587186;--line:#d8e3eb;--surface:#fff;--nav:#142a3c;--accent:#17669e;--soft:#edf4f8;--warn:#9a5b12;--danger:#a93535}
    *{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #1d78b5;outline-offset:2px}
    .app{display:grid;grid-template-columns:176px minmax(0,1fr);min-height:100vh}.rail{background:var(--nav);color:#dcebf4;padding:16px 8px;position:sticky;top:0;height:100vh}.brand{font-weight:750;font-size:15px;line-height:1.2;padding:4px 10px 32px;color:#fff}.rail button{display:block;width:100%;height:38px;text-align:left;border:0;background:transparent;color:inherit;border-radius:3px;padding:0 11px;margin:4px 0}.rail button[aria-current="page"]{background:#2b4e68;color:#fff;font-weight:650}.rail .foot{position:absolute;bottom:18px;left:18px;color:#a8c0d0;font-size:11px}.body{min-width:0}.top{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 16px;position:sticky;top:0;z-index:5}.top .global{width:350px}.top .spacer{flex:1}.top .count{white-space:nowrap;color:#355b74}.top .iconbtn{background:none;border:0;color:var(--ink)}.main{padding:12px 16px 20px;max-width:1800px;margin:auto}.toolbar{display:flex;align-items:center;gap:10px;min-height:40px;flex-wrap:wrap;margin-bottom:9px}.eyebrow{font-size:10px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:#668094}.strong{font-size:14px;font-weight:700}.push{margin-left:auto}.help{border:0;background:transparent;color:#47728e;font-weight:700;padding:3px 6px}.btn{border:1px solid #bdceda;background:#fff;color:#214761;border-radius:3px;min-height:34px;padding:0 12px;font-weight:600}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.btn.tiny{min-height:27px;padding:0 8px}.field{background:#fff;border:1px solid #b9cbd8;border-radius:2px;color:#29495e;min-height:36px;padding:0 10px}.field::placeholder,textarea::placeholder{color:#8297a5}.field.search{width:min(480px,100%)}.field.small{min-height:32px}.meta{font-size:11px;color:var(--muted);margin:7px 0 12px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #c7d6e1;border-radius:3px;background:#fff;padding:7px 10px;color:#31546b}.chip.on{border-color:#81b6d8;background:#edf7fd;color:#125d91}.panel{background:#fff;border:1px solid var(--line);min-width:0}.panelhead{height:36px;padding:0 13px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);font-weight:700;font-size:10px;letter-spacing:.05em;color:#526e81}.panelhead .end{margin-left:auto;letter-spacing:0;text-transform:none;font-size:11px}.tablewrap{overflow:auto;max-height:calc(100vh - 220px);min-height:380px}.gridtable{border-collapse:collapse;width:100%;min-width:990px;table-layout:fixed;background:#fff}.gridtable th{position:sticky;top:0;z-index:2;background:#eaf2f7;text-align:left;color:#547084;font-size:10px;letter-spacing:.05em;font-weight:750;padding:10px 12px;white-space:nowrap}.gridtable td{height:34px;border-bottom:1px solid #edf2f5;padding:6px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gridtable tr:hover td{background:#f1f8fc}.gridtable a{color:#125e96;font-weight:600;text-decoration:none}.gridtable a:hover{text-decoration:underline}.status{display:inline-block;padding:3px 7px;border-radius:2px;background:#eaf2f7;color:#315977;white-space:nowrap}.status.warn{background:#fff3df;color:#8b570e}.status.good{background:#e6f4ec;color:#176346}.tablefoot{height:39px;display:flex;align-items:center;padding:0 12px;color:var(--muted);gap:15px}.columns{display:grid;grid-template-columns:265px minmax(340px,1fr) 364px;gap:10px;align-items:stretch}.columns.two{grid-template-columns:minmax(0,1fr) minmax(360px, .72fr)}.kv{display:grid;grid-template-columns:100px 1fr;gap:0 8px;margin:0;padding:8px 12px}.kv dt,.kv dd{padding:7px 0;margin:0;border-bottom:1px solid #edf2f5}.kv dt{color:#607a8c}.kv dd{font-weight:550}.subhead{font-size:10px;font-weight:750;letter-spacing:.05em;color:#627e91;margin:16px 12px 7px}.stack{padding:10px 12px}.stack>*+*{margin-top:9px}.muted{color:var(--muted)}.tabs{display:flex;gap:20px;padding:0 12px;border-bottom:1px solid var(--line);height:39px;align-items:stretch}.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:#4d6c81;padding:0 1px}.tabs button.active{border-color:var(--accent);color:#185f90;font-weight:700}.event{padding:12px 14px;border-bottom:1px solid #e8eef2}.event strong{display:block;margin-bottom:5px}.event .date{font-size:10px;color:#678396}.form{padding:10px 14px}.form label{display:block;font-weight:650;color:#3b5c73;margin:11px 0 5px}.form input,.form select,.form textarea{display:block;width:100%;border:1px solid #b9cbd8;border-radius:2px;background:#fff;color:var(--ink);padding:8px 9px;min-height:36px}.form textarea{min-height:85px;resize:vertical}.form .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.required{color:#a43d2e}.notice{background:#eef6fb;border-left:3px solid #3181b5;padding:9px 11px;color:#315b74;margin:10px 0}.notice.warn{background:#fff6e6;border-color:#d48a1d;color:#79541e}.validation{font-size:11px;color:#9b3434;margin:5px 0}.hide{display:none!important}.sectionline{border-top:1px solid var(--line);padding-top:11px;margin-top:11px}.mini{font-size:11px;line-height:1.6}.summaryline{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.summaryline strong{color:#193c55}.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:9px}.kpi{background:#fff;border:1px solid var(--line);padding:12px}.kpi b{display:block;font-size:22px;margin-top:5px}.bar{height:8px;background:#e2edf3;margin:7px 0;border-radius:2px}.bar>i{display:block;height:100%;background:#2b80b1;border-radius:2px}.opsnav{display:flex;gap:4px;margin-bottom:9px;overflow:auto}.opsnav button{white-space:nowrap}.opsgrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:10px}.list{padding:7px}.list button{display:block;width:100%;text-align:left;background:#fff;border:0;padding:10px;color:#35566d}.list button.sel{background:#e8f3fa;color:#165d91;font-weight:700}.mobilecards{display:none}.dialogback{position:fixed;inset:0;background:#09223891;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}.dialog{background:#fff;width:min(480px,100%);box-shadow:0 18px 52px #102b4759}.dialoghead{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}.dialogbody{padding:16px 18px;line-height:1.55}.dialogactions{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}.mobilemenu{display:none}.screenhint{background:#f7fafc;border:1px solid var(--line);padding:9px 11px;color:#526f82;font-size:11px;margin-bottom:9px}.tag{display:inline-block;background:#eef4f8;border:1px solid #d7e4eb;padding:3px 6px;margin:2px}.filterrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
    @media(max-width:1000px){.columns{grid-template-columns:230px minmax(0,1fr)}.columns>.composer{grid-column:1/-1}.kpis{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:700px){.app{display:block}.rail{position:fixed;z-index:12;left:0;top:0;width:240px;transform:translateX(-100%);transition:transform .2s}.rail.open{transform:none}.mobilemenu{display:inline-block}.top{gap:7px;padding:0 11px}.top .global{width:100%;min-width:0}.top .count{display:none}.main{padding:9px}.toolbar{align-items:flex-start}.columns,.columns.two,.opsgrid{display:block}.columns>.panel,.columns.two>.panel,.opsgrid>.panel{margin-bottom:9px}.kpis{grid-template-columns:repeat(2,1fr)}.tablewrap{display:none}.mobilecards{display:block}.mobilecard{display:grid;grid-template-columns:1fr auto;gap:5px;border-bottom:1px solid var(--line);padding:12px}.mobilecard strong{color:#125e96}.mobilecard small{color:var(--muted)}.form .row{grid-template-columns:1fr}.rail .foot{bottom:16px}}
    .top{height:40px;gap:12px}.top .scope{color:#385b70;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .topaction{min-height:28px}.tablewrap{max-height:calc(100vh - 208px)}
    @media(max-width:700px){.top .scope{max-width:140px}.top .topaction{display:none}.top #role{max-width:142px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail" aria-label="Primary navigation">
    <div class="brand">NolenixSync<br>CRM</div>
    <nav id="nav"></nav>
    <div class="foot">Design concept • Local demo</div>
  </aside>
  <div class="body">
    <header class="top"><button class="iconbtn mobilemenu" id="menuBtn" aria-label="Open navigation">☰</button><span class="scope" id="roleScope" aria-live="polite"></span><div class="spacer"></div><button class="btn tiny topaction" data-action="roleShortcut" id="roleAction"></button><button class="iconbtn" title="Help" aria-label="Help">ⓘ</button><select class="field small" id="role" aria-label="Preview role"><option value="rep">Representative view</option><option value="manager">Manager view</option><option value="admin">Administrator view</option><option value="exec">Executive view</option></select></header>
    <main class="main" id="main"></main>
  </div>
</div>
<div id="modalRoot"></div>
<script>
const catalog=[["HHTLAA1","TASKI R1 Super","(2x5 lit)"],["HHTLBA1","TASKI R2","(2x5 lit)"],["HHTLCA1","TASKI R3","(2x5 lit)"],["HHTLDA2","TASKI R 4","(2x5 lit)"],["HHTLEA1","TASKI R 5","(2x5 lit)"],["HHTLFA1","TASKI R6","(2x5 lit)"],["6169974","TASKI R6","(24 x 500 ml)"],["HHTLQA1","TASKI R7","(2x5 lit)"],["HHTLGA1","TASKI R9","(2x5 lit)"],["HHTLIC1","TASKI SPIRAL","(1x25 lit)"],["HHTLIA1","TASKI SPIRAL","(2x5 lit)"],["4053425","TASKI SPIRAL HD","(2x5 lit)"],["HHTLPA1","TASKI R20 STRIP","(2x5 lit)"],["6226895","TASKI ALL PURPOSE CLEANER","(20X500ml)"],["5577061","TASKI FLOOR CLEANER CONCENTRATE","(10X1 Ltr)"],["5577079","TASKI FLOOR CLEANER CONCENTRATE","(2X5 Ltr)"]];
const accounts=[
  {id:"AC-00982",name:"Arcstone Facilities",city:"Mumbai",region:"West",stage:"Not Started",next:"Today",last:"No calls",owner:"Me",phone:"9820001122"},
  {id:"AC-01104",name:"Bluefield Kitchens",city:"Not Identified",region:"West",stage:"Discovery",next:"Today",last:"Yesterday",owner:"Me",phone:"9820001199"},
  {id:"AC-00231",name:"Cedar Ridge Offices",city:"Pune",region:"West",stage:"Not Started",next:"Today",last:"No calls",owner:"Me",phone:"9833304421"},
  {id:"AC-00718",name:"Evermark Logistics",city:"Bengaluru",region:"South",stage:"Qualified",next:"Tomorrow",last:"18 Sep",owner:"Me",phone:"9844001221"},
  {id:"AC-00476",name:"Fountain Retail Group",city:"Not Identified",region:"North",stage:"Not Started",next:"Tomorrow",last:"No calls",owner:"Me",phone:"9811005566"},
  {id:"AC-01203",name:"Grove Hospitality",city:"Chennai",region:"South",stage:"Proposal",next:"23 Sep",last:"16 Sep",owner:"Me",phone:"9840887722"},
  {id:"AC-00642",name:"Harborview Properties",city:"Hyderabad",region:"South",stage:"Not Started",next:"23 Sep",last:"No calls",owner:"Me",phone:"9849003377"},
  {id:"AC-00315",name:"Iris Care Network",city:"Delhi",region:"North",stage:"Discovery",next:"24 Sep",last:"12 Sep",owner:"Me",phone:"9810011188"},
  {id:"AC-00907",name:"Juniper Food Services",city:"Not Identified",region:"West",stage:"Not Started",next:"24 Sep",last:"No calls",owner:"Me",phone:"9822006611"},
  {id:"AC-00188",name:"Keystone Workspaces",city:"Mumbai",region:"West",stage:"Qualified",next:"25 Sep",last:"10 Sep",owner:"Me",phone:"9820007755"},
  {id:"AC-01051",name:"Lattice Distribution",city:"Ahmedabad",region:"West",stage:"Not Started",next:"25 Sep",last:"No calls",owner:"Me",phone:"9825008811"},
  {id:"AC-00532",name:"Morrowfield Hotels",city:"Kochi",region:"South",stage:"Discovery",next:"26 Sep",last:"09 Sep",owner:"Me",phone:"9847001234"},
  {id:"AC-00074",name:"Northbank Services",city:"Not Identified",region:"North",stage:"Not Started",next:"26 Sep",last:"No calls",owner:"Me",phone:"9811001123"},
  {id:"AC-00844",name:"Oakline Estates",city:"Pune",region:"West",stage:"Not Started",next:"29 Sep",last:"No calls",owner:"Me",phone:"9833008812"},
  {id:"AC-01165",name:"Pinecrest Clinics",city:"Jaipur",region:"North",stage:"Qualified",next:"29 Sep",last:"07 Sep",owner:"Me",phone:"9829007712"},
  {id:"AC-00429",name:"Quarryside Retail",city:"Surat",region:"West",stage:"Not Started",next:"30 Sep",last:"No calls",owner:"Me",phone:"9825009812"},
  {id:"AC-00608",name:"Riverbend Campus",city:"Not Identified",region:"South",stage:"Not Started",next:"01 Oct",last:"No calls",owner:"Me",phone:"9844007612"},
  {id:"AC-00296",name:"Summit Dining Co.",city:"Bengaluru",region:"South",stage:"Discovery",next:"02 Oct",last:"05 Sep",owner:"Me",phone:"9844003321"}
];
const state={page:"workspace",role:"rep",account:accounts[1],query:"",stage:"All",activity:"Call",ops:"Configuration",opsItem:"Stages",queueTab:"Pending",recordTab:"Calls",sent:0,callCount:4,importStep:"Map"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const btn=(label,action,cls="")=>`<button class="btn ${cls}" data-action="${action}">${label}</button>`;
function nav(){let items=[["workspace","Workspace"],["accounts","Accounts"],["records","Activity records"],["queue","Stage email"],["operations","Operations"],["analytics","Analytics"],["registration","Registration"]];if(state.role==="rep")items=items.filter(x=>!["operations","analytics","registration"].includes(x[0]));if(state.role==="manager")items=items.filter(x=>!["operations","registration"].includes(x[0]));if(state.role==="exec")items=items.filter(x=>!["queue","operations","registration"].includes(x[0]));$("#nav").innerHTML=items.map(([id,label])=>`<button data-page="${id}" ${state.page===id?'aria-current="page"':""}>${label}</button>`).join("");}
function topbar(){let context={rep:["Representative • Assigned accounts","Find account"],manager:["Manager • Team scope","Review stage email"],admin:["Operations • Administrator scope","Review approvals"],exec:["Executive • Authorized territories","Open analytics"]}[state.role];$("#roleScope").textContent=context[0];$("#roleAction").textContent=context[1];}
function workspace(){return `<div class="toolbar"><span class="eyebrow">Workspace / Accounts</span><span class="strong">My work: 18 due today</span><span class="muted">4 calls logged</span><span class="push"></span>${btn("+ New account","newAccount","primary")}</div><div class="filterrow"><input class="field search" id="finder" value="${esc(state.query)}" placeholder="Find by account name, exact ID or phone" aria-label="Find account"><button class="chip" data-action="territory">Territory: All ▾</button><button class="chip ${state.stage!=="All"?"on":""}" data-action="stageFilter">Stage: ${state.stage} ▾</button><button class="chip on" data-action="due">Due: Today ▾</button><button class="chip" data-action="owner">Owner: Me ▾</button><button class="chip" data-action="moreFilters">More filters ⚙</button></div><div class="meta">1,236 seeded accounts &nbsp;•&nbsp; 955 Not Started &nbsp;•&nbsp; 326 cities Not Identified &nbsp;•&nbsp; 41 sectors Not Identified &nbsp;•&nbsp; Saved view: Default ▾</div>${accountTable()}</div>`;}
function accountTable(){let q=state.query.toLowerCase().trim();let rows=accounts.filter(a=>(!q||[a.name,a.id,a.phone].some(v=>v.toLowerCase().includes(q)))&&(state.stage==="All"||a.stage===state.stage));return `<section class="panel"><div class="tablewrap"><table class="gridtable"><thead><tr><th style="width:24%">ACCOUNT</th><th style="width:11%">ID</th><th style="width:15%">CITY / REGION</th><th style="width:14%">STAGE</th><th style="width:12%">NEXT ACTION</th><th style="width:13%">LAST TOUCH</th><th style="width:11%">OWNER</th></tr></thead><tbody>${rows.map(a=>`<tr><td><a href="#" data-account="${a.id}">${esc(a.name)}</a></td><td>${a.id}</td><td>${a.city} / ${a.region}</td><td><span class="status">${a.stage}</span></td><td>${a.next}</td><td>${a.last}</td><td>${a.owner}</td></tr>`).join("")||'<tr><td colspan="7">No matching accounts. Try an ID, phone number, or a broader name.</td></tr>'}</tbody></table></div><div class="mobilecards">${rows.map(a=>`<div class="mobilecard" data-account="${a.id}"><strong>${esc(a.name)}</strong><span class="status">${a.stage}</span><small>${a.id} • ${a.city}</small><small>Next: ${a.next}</small></div>`).join("")}</div><div class="tablefoot">Rows 1 to ${rows.length} of 1,236 <span class="push"></span>25 per page ▾ &nbsp; Previous &nbsp; 1 &nbsp; 2 &nbsp; 3 &nbsp; Next</div></section>`;}
function account(){let a=state.account;return `<div class="toolbar"><button class="btn tiny" data-page="workspace">← Accounts</button><span class="strong">${esc(a.name)}</span><span class="muted">${a.id} &nbsp;•&nbsp; ${a.stage} &nbsp;•&nbsp; ${a.city} / ${a.region} &nbsp;•&nbsp; Next action ${a.next}</span><span class="push"></span>${btn("Edit account","editAccount")}</div><div class="columns"><section class="panel"><div class="panelhead">ACCOUNT CONTEXT <span class="end"><button class="help" title="Account and email readiness details">ⓘ</button></span></div><dl class="kv"><dt>Stage</dt><dd>${a.stage}</dd><dt>Potential</dt><dd>Not captured</dd><dt>Category</dt><dd>Prospect</dd><dt>Region</dt><dd>${a.region}</dd><dt>City</dt><dd>${a.city}</dd><dt>Sector</dt><dd>Not Identified</dd><dt>Next action</dt><dd>${a.next}</dd></dl><div class="subhead">CONTACTS <button class="help" data-action="manageContacts">Manage</button></div><div class="stack muted">No managed contact yet.<br>Imported POC details may be unstructured. ⓘ</div><div class="subhead sectionline">STAGE EMAIL READINESS</div><div class="stack mini">✓ Customer name<br>✕ Location missing<br>✕ Sector missing<br>✕ Person contacted missing<br>✕ Designation missing<br>✕ Application missing<br>✕ Closure month missing</div></section><section class="panel"><div class="panelhead">ACTIVITY TIMELINE <span class="end"><button class="help" data-action="addNote">+ Note</button></span></div><div class="tabs"><button class="active">All 12</button><button>Calls 1</button><button>Canvass 0</button><button>Orders 0</button><button>Notes 11</button></div><div class="event"><span class="date">18 SEP 2026 • IMPORTED CALL</span><strong>Connected • Discovery</strong>Spoke with account contact about follow-up.<br><span class="muted">Source actor email retained from import.</span></div><div class="event"><span class="date">16 SEP 2026 • ACCOUNT NOTE</span><strong>Pilot discussion</strong>Interest in a pilot discussion. Confirm contact and location.</div><div class="event"><span class="date">03 SEP 2026 • ACCOUNT NOTE</span><strong>Contact verification</strong>Contact details need verification before stage email dispatch.</div><div class="stack"><button class="btn tiny" data-page="records">View all account activity</button></div></section><section class="panel composer"><div class="panelhead">LOG ACTIVITY</div><div class="tabs" id="activityTabs">${["Call","Email canvass","Order"].map(x=>`<button data-activity="${x}" class="${state.activity===x?"active":""}">${x}</button>`).join("")}</div>${activityForm()}</section></div>`;}
function activityForm(){if(state.activity==="Call")return `<form class="form" id="callForm"><label>Outcome <span class="required">*</span></label><select name="outcome" required><option value="">Select configured outcome</option><option>Connected</option><option>Not reached</option><option>Follow-up</option></select><div class="row"><div><label>Person contacted</label><input name="contact" placeholder="Select or enter"></div><div><label>Application interest</label><input name="application" placeholder="Optional"></div></div><div class="row"><div><label>Expected closure month</label><input name="closure" type="month"></div><div><label>Potential amount</label><input name="amount" type="number" min="0" placeholder="Optional"></div></div><div class="row"><div><label>Next action date</label><input name="next" type="date"></div><div><label>Stage</label><select name="stage"><option>${state.account.stage}</option>${["Not Started","Discovery","Qualified","Proposal"].filter(x=>x!==state.account.stage).map(x=>`<option>${x}</option>`).join("")}</select></div></div><label>Call notes</label><textarea name="notes" placeholder="Add concise follow-up notes"></textarea><div class="meta">Only outcome is required to save a call. Stage changes create a pending email record. ⓘ</div><div class="actions"><button class="btn primary" type="submit">Save call</button></div></form>`;if(state.activity==="Email canvass")return `<form class="form" id="canvassForm"><label>Email type <span class="required">*</span></label><select name="type" required><option value="">Select configured type</option><option>Introduction</option><option>Follow-up</option><option>Product information</option></select><label>Channel</label><select name="channel"><option>Email</option><option>Other configured channel</option></select><label>Subject or summary</label><input name="subject" placeholder="What was sent?"><div class="meta">Email canvassing records a configured type, channel, summary, time, and account. ⓘ</div><label>Notes</label><textarea name="notes" placeholder="Relevant response or next action"></textarea><div class="actions"><button class="btn primary" type="submit">Save canvass log</button></div></form>`;return `<form class="form" id="orderForm"><label>Total order value <span class="required">*</span></label><input name="amount" type="number" min="0.01" step="0.01" placeholder="Customer-provided total value" required><label>Products <span class="required">*</span></label><input name="productSearch" id="productSearch" placeholder="Find SKU, product or pack"><div class="stack mini" id="productOptions" style="max-height:180px;overflow:auto">${catalog.map(([id,name,pack])=>`<label><input type="checkbox" name="products" value="${id}" style="display:inline;width:auto;min-height:0"> ${name} • ${pack} • ${id}</label>`).join("")}</div><div class="meta">One customer-provided total value and exact catalog SKU selections. No quantity or line pricing in the approved contract. ⓘ</div><label>Distributor</label><input value="Resolved by city, then configured default" readonly><label>Order notes</label><textarea name="notes" placeholder="Optional context"></textarea><div class="actions"><button class="btn primary" type="submit">Save order</button></div><div id="orderError" class="validation" role="alert"></div></form>`;}
function records(){const tab=state.recordTab;const heads={Calls:["DATE","ACCOUNT","OUTCOME","CONTACT","STAGE","ACTOR"],Orders:["DATE","ACCOUNT","AMOUNT","PRODUCTS","DISTRIBUTOR","STATUS"],Canvass:["DATE","ACCOUNT","TYPE","SUBJECT","ACTOR","CHANNEL"],"Stage emails":["DATE","ACCOUNT","TRANSITION","RECIPIENTS","STATUS","ACTOR"]};const rows={Calls:[["18 Sep 2026","Bluefield Kitchens","Connected","Not captured","Discovery","Imported actor"],["12 Sep 2026","Iris Care Network","Follow-up","Not captured","Discovery","Imported actor"],["10 Sep 2026","Keystone Workspaces","Connected","Not captured","Qualified","Imported actor"]],Orders:[["","","No orders logged","","",""]],Canvass:[["","","No canvass logs in this sample","","",""]],"Stage emails":[["21 Sep 2026","Bluefield Kitchens","Discovery → Qualified","Not selected","Pending","Me"]]};return `<div class="toolbar"><span class="eyebrow">Activity records</span><span class="strong">Search, audit, and follow up</span><span class="push"></span>${btn("Export view","export")}</div><div class="tabs" style="background:#fff;margin-bottom:9px">${Object.keys(heads).map(x=>`<button data-record-tab="${x}" class="${tab===x?"active":""}">${x}</button>`).join("")}</div><div class="filterrow"><input class="field search" placeholder="Search account, ID, actor or summary" aria-label="Search activity"><button class="chip">Date range ▾</button><button class="chip">Territory ▾</button><button class="chip">Owner ▾</button><button class="chip">Status ▾</button><button class="chip">Clear filters</button></div><section class="panel"><div class="tablewrap"><table class="gridtable"><thead><tr>${heads[tab].map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows[tab].map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div><div class="tablefoot">Historical calls preserve source actor email. Current activity uses verified identity. <span class="push"></span>Rows 1 to ${rows[tab].length}</div></section>`;}
function queue(){let pending=state.queueTab==="Pending";return `<div class="toolbar"><span class="eyebrow">Stage email</span><span class="strong">${Math.max(0,2-state.sent)} pending transitions</span><span class="push"></span>${btn("Recipient groups","groups")}</div><div class="tabs" style="background:#fff;margin-bottom:9px"><button data-queue-tab="Pending" class="${pending?"active":""}">Pending</button><button data-queue-tab="Sent" class="${!pending?"active":""}">Sent history</button></div>${pending?`<div class="columns two"><section class="panel"><div class="panelhead">QUEUE <span class="end">Select to review • no automatic dispatch</span></div><table class="gridtable" style="min-width:0"><thead><tr><th>ACCOUNT</th><th>TRANSITION</th><th>READINESS</th><th>CREATED</th></tr></thead><tbody><tr><td><button class="help" data-action="queueSelect">Bluefield Kitchens</button></td><td>Discovery → Qualified</td><td><span class="status warn">6 missing fields</span></td><td>Today</td></tr><tr><td>Grove Hospitality</td><td>Proposal → Won</td><td><span class="status good">Ready to review</span></td><td>Yesterday</td></tr></tbody></table><div class="stack mini">A stage change is recorded immediately, even when the email cannot yet be sent. Blocked reasons stay here, not in executive analytics.</div></section><section class="panel"><div class="panelhead">REVIEW TRANSITION <span class="end">Bluefield Kitchens • AC-01104</span></div><div class="stack"><div class="summaryline"><strong>Discovery → Qualified</strong><span>Created by verified representative</span></div><div class="notice warn"><strong>Dispatch blocked:</strong> location, sector, person contacted, designation, application, and closure month are missing. <button class="help" data-action="openAccount">Open Account 360</button></div><label>Recipients <span class="required">*</span></label><div><label><input type="checkbox"> Regional manager group</label> &nbsp; <label><input type="checkbox"> Approved recipient</label></div><div class="sectionline"><strong>Email preview</strong><p>Customer: Bluefield Kitchens<br>Stage: Discovery → Qualified<br>Opportunity value: omitted until captured<br>Recipient: not selected</p></div><div class="actions" style="display:flex;justify-content:flex-end;gap:8px">${btn("Dismiss","dismiss","danger")}${btn("Dispatch email","dispatch","primary")}</div></div></section></div>`:`<section class="panel"><div class="panelhead">SENT EMAIL HISTORY</div><div class="stack">No emails sent in this design session. A real dispatch requires validated fields and explicit recipients.</div></section>`}`;}
function operations(){let tabs=["Configuration","CRM Fields","Import Studio","Roles and Access","Access Approvals"];let op=state.ops;let body=op==="Configuration"?`<div class="opsgrid"><section class="panel"><div class="panelhead">CONFIGURATION SETS</div><div class="list">${["Stages","Outcomes","Email types","Products","Distributors","Territories","Recipient groups","Currency and timezone"].map(x=>`<button data-ops-item="${x}" class="${state.opsItem===x?"sel":""}">${x}</button>`).join("")}</div></section><section class="panel"><div class="panelhead">${state.opsItem.toUpperCase()} <span class="end">Versioned • archive, never delete</span></div><div class="toolbar" style="padding:9px 12px;margin:0"><input class="field small" placeholder="Find configured value"><span class="push"></span>${btn("+ Add value","addValue","primary")}</div><table class="gridtable" style="min-width:0"><thead><tr><th>VALUE</th><th>ORDER</th><th>STATUS</th><th>UPDATED BY</th><th>ACTION</th></tr></thead><tbody><tr><td>Not Started</td><td>1</td><td>Active</td><td>Admin</td><td>Edit</td></tr><tr><td>Discovery</td><td>2</td><td>Active</td><td>Admin</td><td>Edit</td></tr><tr><td>Qualified</td><td>3</td><td>Active</td><td>Admin</td><td>Edit</td></tr></tbody></table></section></div>`:op==="CRM Fields"?`<section class="panel"><div class="panelhead">FIELD DEFINITIONS <span class="end">${btn("+ Add field","addField","primary tiny")}</span></div><table class="gridtable"><thead><tr><th>FIELD</th><th>SECTION</th><th>TYPE</th><th>SEARCH</th><th>REP EDIT</th><th>REQUIRED</th></tr></thead><tbody><tr><td>Account name</td><td>Identity</td><td>Text</td><td>Yes</td><td>No</td><td>Yes</td></tr><tr><td>City</td><td>Location</td><td>Configured value</td><td>Yes</td><td>Yes</td><td>No</td></tr><tr><td>Expected closure month</td><td>Opportunity</td><td>Month</td><td>No</td><td>Yes</td><td>For dispatch</td></tr></tbody></table><div class="tablefoot">Preview a field against authorized account data before publishing.</div></section>`:op==="Import Studio"?`<div class="columns two"><section class="panel"><div class="panelhead">IMPORT JOBS</div><div class="stack">Source: CSV or XLSX<br>Recent job: Account import • 1,236 rows • committed<br><span class="muted">No existing account is overwritten without mapped key and preview.</span></div></section><section class="panel"><div class="panelhead">PREVIEW AND COMMIT</div><div class="tabs"><button class="active">Upload</button><button>Map</button><button>Validate</button><button>Commit</button></div><div class="stack"><label>File selection</label><div class="field">Choose a local CSV or XLSX file</div><div class="notice">Map external account ID, inspect duplicates and errors, then explicitly commit. This mockup never imports data.</div>${btn("Preview mappings","previewImport","primary")}</div></section></div>`:op==="Roles and Access"?`<div class="columns two"><section class="panel"><div class="panelhead">ROLE DEFINITIONS</div><div class="stack">Roles are configured records, not hardcoded application constants.<br><br>Example: Representative • Accounts, calls, canvass, orders<br>Example: Manager • Territory oversight, stage queue<br>Example: Administrator • Configuration, imports, approvals</div></section><section class="panel"><div class="panelhead">MODULE AND TERRITORY PERMISSIONS</div><div class="stack">Selected role: Representative<br><br>Accounts: View assigned territories, edit allowed fields<br>Activities: Create and view scoped records<br>Stage email: Prepare only<br>Operations: No access<br><br>${btn("Edit permissions","permissions")}</div></section></div>`:`<div class="columns two"><section class="panel"><div class="panelhead">PENDING ACCESS REQUESTS</div><div class="stack"><strong>2 requests require review</strong><br><br>mira.patel@example.org • requested Representative<br>arun.mehta@example.org • requested Manager</div></section><section class="panel"><div class="panelhead">APPROVAL DETAIL</div><div class="form"><label>Verified business email</label><input value="mira.patel@example.org" readonly><label>Assigned role</label><select><option>Representative</option><option>Manager</option></select><label>Territory scope</label><select><option>West</option><option>North</option><option>South</option></select><div class="actions">${btn("Reject","reject","danger")}${btn("Approve and activate","approve","primary")}</div></div></section></div>`;return `<div class="toolbar"><span class="eyebrow">Operations</span><span class="strong">Configure and govern</span><span class="push"></span><span class="muted">Administrator scope</span></div><div class="opsnav">${tabs.map(x=>`<button class="btn ${op===x?"primary":""}" data-ops="${x}">${x}</button>`).join("")}</div>${body}`;}
function analytics(){return `<div class="toolbar"><span class="eyebrow">Executive analytics</span><span class="strong">Performance and pipeline</span><span class="push"></span><button class="chip">Date: Last 30 days ▾</button><button class="chip">Territory: All allowed ▾</button></div><div class="kpis"><div class="kpi">Accounts<b>1,236</b><small class="muted">Scoped total</small></div><div class="kpi">Calls<b>11</b><small class="muted">Historical imported calls</small></div><div class="kpi">Connected<b>6</b><small class="muted">Illustrative subset</small></div><div class="kpi">Canvass<b>0</b><small class="muted">Current sample</small></div><div class="kpi">Orders<b>0</b><small class="muted">No seeded orders</small></div><div class="kpi">Order value<b>0</b><small class="muted">No seeded revenue</small></div></div><div class="columns two"><section class="panel"><div class="panelhead">FUNNEL POSITION <span class="end">Authorized accounts only</span></div><div class="stack"><div>Not Started <strong class="push">955</strong><div class="bar"><i style="width:77%"></i></div></div><div>Discovery <div class="bar"><i style="width:18%"></i></div></div><div>Qualified <div class="bar"><i style="width:8%"></i></div></div><div>Proposal <div class="bar"><i style="width:4%"></i></div></div><div class="meta">Stage vocabulary and order are configured at runtime.</div></div></section><section class="panel"><div class="panelhead">DATA AND ACTIVITY LENS</div><div class="stack">Calls by date and territory<br><div class="bar"><i style="width:28%"></i></div>Connect rate<br><div class="bar"><i style="width:55%"></i></div>Account movement<br><div class="bar"><i style="width:18%"></i></div><div class="notice">Stage-email validation blocks are Operations data, not executive KPIs.</div></div></section></div>`;}
function registration(){return `<div class="toolbar"><span class="eyebrow">Access</span><span class="strong">Request CRM access</span></div><div class="columns two"><section class="panel"><div class="panelhead">REGISTRATION</div><form class="form" id="registrationForm"><label>Full name <span class="required">*</span></label><input required placeholder="Your full name"><label>Business email <span class="required">*</span></label><input type="email" required placeholder="you@company.example"><label>Requested role <span class="required">*</span></label><select required><option value="">Choose requestable role</option><option>Representative</option><option>Manager</option></select><div class="notice">Your verified email identity is checked before an administrator can approve access.</div><div class="actions"><button class="btn primary" type="submit">Submit request</button></div></form></section><section class="panel"><div class="panelhead">ACCESS STATES</div><div class="stack"><strong>Request submitted</strong><br>Waiting for administrator review.<div class="sectionline"><strong>Approved</strong><br>Assigned role, modules, and territory determine what appears after sign-in.</div><div class="sectionline"><strong>Rejected or inactive</strong><br>Clear status and support route. No CRM data is shown.</div></div></section></div>`;}
function render(){nav();topbar();const view={workspace,accounts:account,records,queue,operations,analytics,registration}[state.page]||workspace;$("#main").innerHTML=view();$("#rail").classList.remove("open");}
function dialog(title,body,actions){$("#modalRoot").innerHTML=`<div class="dialogback" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialoghead">${title}</div><div class="dialogbody">${body}</div><div class="dialogactions">${actions}</div></div></div>`;$("#modalRoot .btn")?.focus();}
function closeDialog(){$("#modalRoot").innerHTML="";}
document.addEventListener("click",e=>{let n=e.target.closest("[data-page],[data-account],[data-activity],[data-ops],[data-ops-item],[data-queue-tab],[data-record-tab],[data-action]");if(!n)return;e.preventDefault();if(n.dataset.page){state.page=n.dataset.page;render();return}if(n.dataset.account){state.account=accounts.find(a=>a.id===n.dataset.account)||state.account;state.page="accounts";render();return}if(n.dataset.activity){state.activity=n.dataset.activity;render();return}if(n.dataset.ops){state.ops=n.dataset.ops;render();return}if(n.dataset.opsItem){state.opsItem=n.dataset.opsItem;render();return}if(n.dataset.queueTab){state.queueTab=n.dataset.queueTab;render();return}if(n.dataset.recordTab){state.recordTab=n.dataset.recordTab;render();return}let a=n.dataset.action;if(a==="stageFilter"){state.stage=state.stage==="All"?"Not Started":state.stage==="Not Started"?"Discovery":"All";render()}else if(a==="openAccount"){state.page="accounts";closeDialog();render()}else if(a==="dispatch"){dialog("Dispatch unavailable","This transition is missing required account context and explicit recipients. Complete the account and review the payload before sending.",btn("Close","closeModal"))}else if(a==="dismiss"){dialog("Dismiss transition?","Dismissal requires an auditable reason. No record is changed in this mockup.",btn("Close","closeModal"))}else if(a==="closeModal"){closeDialog()}else if(a==="prepare"){closeDialog();state.page="queue";render()}else if(a==="leaveQueue"){closeDialog();state.page="accounts";render()}else if(a==="newAccount"||a==="editAccount"){dialog("Account editor","Field visibility and editability follow the signed-in role. This design prototype never writes account data.",btn("Close","closeModal"))}else if(a==="previewImport"){dialog("Import preview","Mapping, duplicate checks, and commit guards are shown as the intended workflow. This local mockup does not upload or commit files.",btn("Close","closeModal"))}else{dialog("Design interaction","This action is illustrated for review. No external system or CRM data is changed.",btn("Close","closeModal"))}});
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="callForm"){let d=new FormData(e.target);if(!d.get("outcome")){e.target.querySelector("[name=outcome]").focus();return}state.callCount++;let newStage=d.get("stage");if(newStage!==state.account.stage){let old=state.account.stage;state.account.stage=newStage;dialog("Stage transition recorded",`The call was saved and ${esc(state.account.name)} moved from ${old} to ${newStage}. A pending stage-email record was created. Choose whether to review it now or leave it in the queue. Sending still requires validation and recipients.`,btn("Leave in queue","leaveQueue")+btn("Review email","prepare","primary"))}else dialog("Call saved in local prototype","The production CRM is unchanged. The design demonstrates the in-account workflow.",btn("Close","closeModal"));render()}else if(e.target.id==="orderForm"){let d=new FormData(e.target),amount=Number(d.get("amount")),products=d.getAll("products");if(!(amount>0)||!products.length){$("#orderError").textContent="Enter a positive order amount and select at least one product.";return}dialog("Order validated in local prototype","Amount and product selections meet the current order contract. Nothing was submitted to staging.",btn("Close","closeModal"))}else if(e.target.id==="canvassForm"){dialog("Canvass log preview","Email type and activity context are ready in this local prototype. Nothing was submitted to staging.",btn("Close","closeModal"))}else if(e.target.id==="registrationForm")dialog("Registration request preview","A real request would wait for verified identity and administrator approval. No request was created.",btn("Close","closeModal"))});
document.addEventListener("input",e=>{if(e.target.id==="productSearch"){let q=e.target.value.toLowerCase();document.querySelectorAll("#productOptions label").forEach(el=>el.hidden=!el.textContent.toLowerCase().includes(q));return}if(e.target.id==="finder"){state.query=e.target.value;let start=e.target.selectionStart;render();let f=$("#finder");f.focus();f.setSelectionRange(start,start)}});
$("#role").addEventListener("change",e=>{state.role=e.target.value;state.page={rep:"workspace",manager:"queue",admin:"operations",exec:"analytics"}[state.role];if(state.role==="admin"){state.ops="Access Approvals"}render()});
$("#roleAction").addEventListener("click",e=>{e.stopPropagation();if(state.role==="rep"){state.page="workspace";render();$("#finder")?.focus()}else if(state.role==="manager"){state.page="queue";render()}else if(state.role==="admin"){state.page="operations";state.ops="Access Approvals";render()}else{state.page="analytics";render()}});
$("#menuBtn").addEventListener("click",()=>$("#rail").classList.toggle("open"));
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDialog();if(e.key==="/"&&state.role==="rep"&&e.target.tagName!=="INPUT"&&e.target.tagName!=="TEXTAREA"){e.preventDefault();state.page="workspace";render();$("#finder")?.focus()}});
render();
</script>
</body>
